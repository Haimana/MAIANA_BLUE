[platformio]
src_dir = Src
include_dir = Inc

[env]
platform = ststm32
board = nucleo_l432kc ; Generic base board, MCU overridden in environments

; FORCE USE OF MODERN GCC (GCC 10.3) to reduce C++ STL binary size
platform_packages =
    toolchain-gccarmnoneeabi@~1.100301.0

; Force usage of local drivers/headers
build_flags =
    -I Inc
    -I Inc/bsp
    -I Drivers/CMSIS/Include
    -I Drivers/CMSIS/Device/ST/STM32L4xx/Include
    -I Drivers/STM32L4xx_HAL_Driver/Inc
    -D USE_HAL_DRIVER
    -D USE_FULL_LL_DRIVER
    -Os
    -Wall
    -fdata-sections
    -ffunction-sections
    -fno-exceptions
    -fno-rtti
    -fno-use-cxa-atexit
    -fno-threadsafe-statics
    ; Enable Link Time Optimization to reduce size
    -flto
    ; Compiler and Linker flags
    -mthumb
    -mcpu=cortex-m4
    ; Let the board/toolchain decide FPU settings to avoid mismatch
    --specs=nano.specs
    --specs=nosys.specs
    -Wl,--gc-sections

; After each successful build, copy firmware.bin to Binaries/ with MCU, env name, FW_REV, breakout, bootloader layout (see scripts/pio_post_copy_firmware.py). Set PIO_COPY_FIRMWARE_BIN=0 to disable.
extra_scripts =
    post:scripts/pio_post_copy_firmware.py

build_src_filter =
    ; Explicitly include core source files
    +<AISMessages.cpp>
    +<ChannelManager.cpp>
    +<CommandProcessor.cpp>
    +<Configuration.cpp>
    +<DataTerminal.cpp>
    +<EventQueue.cpp>
    +<Events.cpp>
    +<GPS.cpp>
    +<LEDManager.cpp>
    +<NMEAEncoder.cpp>
    +<NMEASentence.cpp>
    +<NoiseFloorDetector.cpp>
    +<printf_serial.cpp>
    +<RadioManager.cpp>
    +<Receiver.cpp>
    +<RFIC.cpp>
    +<RXPacket.cpp>
    +<RXPacketProcessor.cpp>
    +<si4460.cpp>
    +<si4463.cpp>
    +<si4467.cpp>
    +<stm32l4xx_it.c>
    +<system_stm32l4xx.c> ; Explicitly include system file
    +<syscalls.c> ; Explicitly include syscalls.c
    +<Transceiver.cpp>
    +<TXPacket.cpp>
    +<TXScheduler.cpp>
    +<Utils.cpp>
    +<main.cpp> ; Explicitly include main.cpp

    +<../Drivers/STM32L4xx_HAL_Driver/Src/> ; Include all HAL driver source files
    - <printf.c>
    - <bsp/bsp_6_0_bad.cpp>
    - <../Drivers/CMSIS_Old>
    - <../Drivers/STM32L4xx_HAL_Driver_Old>
    ; Exclude all bsp implementation files from global filter (each env will add its own)
    - <../Src/bsp/bsp_9_3.cpp>
    - <../Src/bsp/bsp_10_0.cpp>
    - <../Src/bsp/bsp_10_1.cpp>
    - <../Src/bsp/bsp_10_5.cpp>
    - <../Src/bsp/bsp_10_9.cpp>
    - <../Src/bsp/bsp_11_0.cpp>
    - <../Src/bsp/bsp_11_3.cpp>
    ; Exclude ALL startup files from global filter, each env will add its specific one
    - <../startup/*.S>


